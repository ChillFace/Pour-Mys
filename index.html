<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour Mys 🌸</title>
<meta name="theme-color" content="#ffb3d6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Kosugi+Maru&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #ff7eb9;
    --rose-fonce: #e8559a;
    --rose-clair: #ffd3e8;
    --rose-pale: #fff0f7;
    --blanc: #ffffff;
    --marine: #1f2a5c;
    --texte: #4a2140;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Kosugi Maru", "Trebuchet MS", sans-serif;
    color: var(--texte);
    background:
      radial-gradient(circle at 20% 15%, #fff 0 2px, transparent 3px) 0 0 / 46px 46px,
      linear-gradient(180deg, #ffc6e2 0%, #ffe3f0 55%, #ffd0e6 100%);
    background-color: #ffd9eb;
    overflow: hidden;
    min-height: 100svh;
  }

  /* Pétales */
  #petales { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

  /* Branche de cerisier dessinée */
  .branche { position: fixed; top: -10px; width: 62vw; max-width: 360px; z-index: 0; opacity: .95; }
  .branche.g { left: -20px; }
  .branche.d { right: -20px; transform: scaleX(-1); }

  .ecran {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    transition: opacity .8s ease, transform .8s ease;
  }
  .cache { opacity: 0; pointer-events: none; transform: scale(.97); }

  /* Accueil */
  .logo { width: min(88vw, 460px); filter: drop-shadow(0 6px 0 rgba(232,85,154,.25)); animation: flotte 3.2s ease-in-out infinite; }
  .sous-titre {
    margin-top: 18px; font-family: "Mochiy Pop One", sans-serif; color: var(--rose-fonce);
    font-size: clamp(16px, 4.6vw, 22px); text-align: center; letter-spacing: .04em;
    text-shadow: 0 2px 0 #fff;
  }
  .bouton-coeur {
    margin-top: 34px; position: relative; width: 150px; height: 140px; border: none; background: none; cursor: pointer;
    animation: bat 1.1s ease-in-out infinite;
  }
  .bouton-coeur svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 0 rgba(232,85,154,.35)); }
  .bouton-coeur span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 14px;
    font-family: "Mochiy Pop One", sans-serif; font-size: 20px; color: #fff; text-shadow: 0 2px 0 var(--rose-fonce);
  }
  .indice { margin-top: 10px; font-size: 13px; color: #b34f84; opacity: .8; }

  /* Scène */
  .carte {
    width: min(94vw, 440px);
    background: var(--blanc);
    border: 4px solid var(--rose);
    border-radius: 26px;
    box-shadow: 0 0 0 6px var(--rose-clair), 0 14px 30px rgba(200, 60, 130, .25);
    overflow: hidden;
  }
  .ruban {
    position: relative; background: var(--rose-clair); border-bottom: 3px solid var(--rose);
    text-align: center; padding: 10px 12px;
    font-family: "Mochiy Pop One", sans-serif; color: var(--rose-fonce);
    font-size: clamp(15px, 4.4vw, 19px); letter-spacing: .25em;
  }
  .ruban::before, .ruban::after { content: "♥"; color: var(--rose); margin: 0 8px; letter-spacing: 0; }
  .portrait { position: relative; aspect-ratio: 1 / 1; max-height: 46svh; width: 100%; overflow: hidden; background: #f9c6df; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; animation: respire 4s ease-in-out infinite; }
  .portrait::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 65%, rgba(255, 126, 185, .35));
  }

  .dialogue { position: relative; padding: 22px 18px 16px; background: var(--rose-pale); }
  .nom {
    position: absolute; top: -16px; left: 16px;
    background: var(--marine); color: #fff; border: 3px solid #fff; border-radius: 12px;
    padding: 4px 14px; font-size: 14px; letter-spacing: .08em; box-shadow: 0 3px 0 var(--rose);
  }
  .texte { min-height: 4.8em; font-size: clamp(17px, 4.8vw, 20px); line-height: 1.55; }
  .curseur { display: inline-block; width: .5em; animation: clignote .8s steps(1) infinite; color: var(--rose); }

  .question { display: none; margin-top: 14px; text-align: center; }
  .question.visible { display: block; animation: apparait .5s ease; }
  .question p { font-family: "Mochiy Pop One", sans-serif; color: var(--rose-fonce); font-size: 17px; }
  .choix { position: relative; margin-top: 12px; height: 52px; display: flex; gap: 14px; justify-content: center; }
  .choix button {
    font-family: "Mochiy Pop One", sans-serif; font-size: 16px; border-radius: 999px; padding: 10px 26px; cursor: pointer;
    border: 3px solid var(--rose); transition: transform .2s ease, left .25s ease, top .25s ease;
  }
  #oui { background: var(--rose); color: #fff; box-shadow: 0 4px 0 var(--rose-fonce); }
  #non { background: #fff; color: var(--rose-fonce); }
  #non.fuit { position: fixed; z-index: 5; }

  .final { display: none; text-align: center; margin-top: 10px; font-family: "Mochiy Pop One", sans-serif; color: var(--rose-fonce); font-size: 18px; }
  .final.visible { display: block; animation: apparait .6s ease; }

  .outils { position: fixed; z-index: 6; top: max(12px, env(safe-area-inset-top)); right: 12px; display: flex; gap: 8px; }
  .outils button {
    width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--rose); background: #fff;
    font-size: 19px; cursor: pointer; box-shadow: 0 3px 0 var(--rose-clair);
  }

  .confetti { position: fixed; z-index: 7; pointer-events: none; font-size: 22px; animation: pluie 2.6s ease-in forwards; }

  /* ---------- Mode terrifiant ---------- */
  body { transition: background-color .3s; }
  body.horreur {
    background: radial-gradient(ellipse at center, #3a0000 0%, #120000 70%, #000 100%);
    background-color: #120000;
    animation: secousse .12s linear infinite;
  }
  body.horreur .branche { filter: grayscale(1) brightness(.25) sepia(1) hue-rotate(-40deg) saturate(6); }
  body.horreur .carte {
    border-color: #8a0000; box-shadow: 0 0 0 6px #2a0000, 0 0 40px 10px rgba(200, 0, 0, .7);
    animation: tremble .09s linear infinite;
  }
  body.horreur .ruban { background: #2a0000; color: #ff2020; border-color: #8a0000; letter-spacing: .3em; }
  body.horreur .ruban::before, body.horreur .ruban::after { color: #ff2020; }
  body.horreur .portrait::after { background: radial-gradient(ellipse at center, transparent 40%, rgba(120, 0, 0, .75)); }
  body.horreur .portrait img { filter: contrast(1.35) saturate(1.5) sepia(.35) hue-rotate(-25deg); animation: zoomPeur .35s ease-in-out infinite alternate; }
  body.horreur .dialogue { background: #1a0000; color: #ff3030; }
  body.horreur .nom { background: #8a0000; }
  body.horreur .question { visibility: hidden; }
  body.horreur #non { visibility: hidden; }
  body.horreur .outils button { border-color: #8a0000; background: #1a0000; }

  #sang { position: fixed; inset: 0; z-index: 8; pointer-events: none; display: none; overflow: hidden; }
  body.horreur #sang { display: block; }
  #sang .voile { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 25%, rgba(60, 0, 0, .9) 75%, #000 100%); animation: pulse .45s ease-in-out infinite; }
  #sang .flash { position: absolute; inset: 0; background: #ff0000; mix-blend-mode: multiply; animation: flash 1.1s steps(1) infinite; }
  #sang .noir { position: absolute; inset: 0; background: #000; opacity: 0; animation: coupure 2.3s steps(1) infinite; }
  #sang .lignes {
    position: absolute; inset: -20px 0; opacity: .35;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.6) 0 2px, transparent 2px 4px);
    animation: defile .25s linear infinite;
  }
  #sang svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #sang .goutte { transform-box: fill-box; transform-origin: top; animation: coule 7s cubic-bezier(.25,.1,.35,1) both; }
  #sang .tache { transform-box: fill-box; transform-origin: center; animation: eclabousse .18s ease-out both; }
  #sang .flaque { transform-box: fill-box; transform-origin: bottom; animation: monte 9s ease-in both; }
  #mots { position: absolute; inset: 0; }
  .mot {
    position: absolute; white-space: nowrap; font-family: "Creepster", "Impact", sans-serif;
    color: #e00000; -webkit-text-stroke: 1.5px #000; paint-order: stroke fill;
    text-shadow: 0 0 10px #ff0000, 3px 4px 0 #000;
    animation: apparaitMot .25s ease-out both, trembleMot .08s linear infinite;
  }
  .mot.coule::after {
    content: ""; position: absolute; left: 30%; top: 85%; width: 4px; height: 0;
    background: linear-gradient(#b00000, #600000); border-radius: 0 0 3px 3px; animation: filet 2s ease-in forwards;
  }
  body.horreur .portrait img.glitch { filter: drop-shadow(6px 0 0 rgba(255,0,0,.8)) drop-shadow(-6px 0 0 rgba(0,255,255,.5)) contrast(1.6); transform: translateX(8px) skewX(6deg) scale(1.2); }
  body.horreur .texte { font-family: "Creepster", "Impact", sans-serif; font-size: 24px; letter-spacing: .06em; animation: tremble .07s linear infinite; }
  body.crescendo .carte { animation-duration: .05s; }
  body.crescendo { animation-duration: .06s; }
  body.crescendo #sang .flash { animation-duration: .45s; }

  @keyframes coupure { 0%, 100% { opacity: 0; } 40% { opacity: .95; } 43% { opacity: 0; } 78% { opacity: .9; } 79% { opacity: 0; } }
  @keyframes defile { to { transform: translateY(4px); } }
  @keyframes eclabousse { from { transform: scale(0); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
  @keyframes monte { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes apparaitMot { from { opacity: 0; transform: scale(2.4) rotate(var(--r)); filter: blur(6px); } to { opacity: var(--o); transform: scale(1) rotate(var(--r)); } }
  @keyframes trembleMot { 50% { translate: 2px -2px; } }
  @keyframes filet { to { height: 60px; } }

  @keyframes secousse { 0% { background-position: 0 0; } 50% { background-position: 3px -3px; } }
  @keyframes tremble {
    0% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(-6px, 4px) rotate(-1.2deg); }
    50% { transform: translate(5px, -5px) rotate(1deg); } 75% { transform: translate(-4px, -3px) rotate(-.6deg); }
    100% { transform: translate(4px, 5px) rotate(.8deg); }
  }
  @keyframes zoomPeur { from { transform: scale(1.05); } to { transform: scale(1.18) rotate(-1deg); } }
  @keyframes pulse { 50% { opacity: .55; } }
  @keyframes flash { 0%, 100% { opacity: 0; } 8% { opacity: .55; } 12% { opacity: 0; } 55% { opacity: .35; } 58% { opacity: 0; } }
  @keyframes coule { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  @keyframes flotte { 50% { transform: translateY(-8px); } }
  @keyframes bat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(1); } 45% { transform: scale(1.07); } }
  @keyframes respire { 50% { transform: scale(1.03); } }
  @keyframes clignote { 50% { opacity: 0; } }
  @keyframes apparait { from { opacity: 0; transform: translateY(8px); } }
  @keyframes pluie { to { transform: translateY(110vh) rotate(540deg); opacity: .2; } }
  @media (prefers-reduced-motion: reduce) {
    .logo, .bouton-coeur, .portrait img { animation: none; }
  }
</style>
</head>
<body>

<!-- Branches de cerisier dessinées -->
<svg class="branche g" viewBox="0 0 360 220" aria-hidden="true">
  <path d="M0 40 C 80 50, 140 70, 210 120 S 320 190, 350 200" stroke="#6b3a4a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M120 66 C 150 40, 175 30, 210 28" stroke="#6b3a4a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M230 135 C 250 110, 270 100, 300 98" stroke="#6b3a4a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g fill="#ffb7d5" stroke="#ff8cbf" stroke-width="1.5">
    <g id="fleur"><circle cx="0" cy="-9" r="8"/><circle cx="8.5" cy="-3" r="8"/><circle cx="5.5" cy="7" r="8"/><circle cx="-5.5" cy="7" r="8"/><circle cx="-8.5" cy="-3" r="8"/><circle r="3.5" fill="#ff5fa2" stroke="none"/></g>
    <use href="#fleur" x="60" y="40"/><use href="#fleur" x="110" y="64"/><use href="#fleur" x="160" y="40"/>
    <use href="#fleur" x="210" y="26"/><use href="#fleur" x="190" y="104"/><use href="#fleur" x="250" y="140"/>
    <use href="#fleur" x="300" y="96"/><use href="#fleur" x="320" y="186"/><use href="#fleur" x="30" y="30"/>
  </g>
</svg>
<svg class="branche d" viewBox="0 0 360 220" aria-hidden="true">
  <path d="M0 40 C 80 50, 140 70, 210 120 S 320 190, 350 200" stroke="#6b3a4a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M120 66 C 150 40, 175 30, 210 28" stroke="#6b3a4a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g fill="#ffc7df" stroke="#ff8cbf" stroke-width="1.5">
    <use href="#fleur" x="70" y="44"/><use href="#fleur" x="140" y="76"/><use href="#fleur" x="200" y="30"/>
    <use href="#fleur" x="220" y="122"/><use href="#fleur" x="290" y="170"/>
  </g>
</svg>

<canvas id="petales"></canvas>

<div class="outils">
  <button id="son" aria-label="Couper le son" title="Son">🔊</button>
</div>

<!-- Écran d'accueil -->
<section class="ecran" id="accueil">
  <img class="logo" src="logo.png" alt="Yandere Simulator">
  <p class="sous-titre">Un message spécial pour <b>Mys</b> 🌸</p>
  <button class="bouton-coeur" id="ouvrir" aria-label="Ouvrir le message">
    <svg viewBox="0 0 100 90"><path d="M50 86 C 18 62, 2 44, 2 26 C 2 12, 13 2, 27 2 C 37 2, 45 8, 50 16 C 55 8, 63 2, 73 2 C 87 2, 98 12, 98 26 C 98 44, 82 62, 50 86 Z" fill="#ff7eb9" stroke="#fff" stroke-width="4"/></svg>
    <span>Ouvrir 💌</span>
  </button>
  <p class="indice">touche le cœur</p>
</section>

<!-- Scène du message -->
<section class="ecran cache" id="scene">
  <div class="carte">
    <div class="ruban">POUR MYS</div>
    <div class="portrait"><img src="perso.png" alt=""></div>
    <div class="dialogue">
      <div class="nom">Message</div>
      <p class="texte"><span id="texte"></span><span class="curseur">▌</span></p>
      <div class="question" id="question">
        <p>Tu me pardonnes ?</p>
        <div class="choix">
          <button id="oui">Oui 🌸</button>
          <button id="non">Non</button>
        </div>
      </div>
      <p class="final" id="final">Merci Mys !! 💪🌸</p>
    </div>
  </div>
</section>

<div id="sang" aria-hidden="true">
  <div class="voile"></div>
  <svg id="gouttes" preserveAspectRatio="none"></svg>
  <div id="mots"></div>
  <div class="lignes"></div>
  <div class="flash"></div>
  <div class="noir"></div>
</div>
<link rel="preload" as="image" href="fache.png">

<audio id="m-menu" src="menu.mp3" loop preload="auto"></audio>
<audio id="m-ecole" src="schoolday.mp3" loop preload="auto"></audio>
<audio id="m-kiss" src="dreams.mp3" loop preload="auto"></audio>

<script>
  const MESSAGE = "Je suis désolé de t'avoir mis des vus, Mys… je suis juste occupé 💪";

  // ---------- Pétales ----------
  const cv = document.getElementById("petales"), ctx = cv.getContext("2d");
  let W, H, petales = [], enHorreur = false;
  function taille() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
  taille(); addEventListener("resize", taille);
  const calme = matchMedia("(prefers-reduced-motion: reduce)").matches;
  for (let i = 0; i < (calme ? 10 : 34); i++) petales.push(nouveau(true));
  function nouveau(partout) {
    const s = (6 + Math.random() * 8) * devicePixelRatio;
    return { x: Math.random() * W, y: partout ? Math.random() * H : -20, s,
      vy: (0.5 + Math.random()) * devicePixelRatio, vx: (Math.random() - .3) * devicePixelRatio,
      a: Math.random() * 6.28, va: (Math.random() - .5) * .05, o: Math.random() * 6.28 };
  }
  function dessine() {
    ctx.clearRect(0, 0, W, H);
    for (const p of petales) {
      p.o += .02; p.x += p.vx + Math.sin(p.o) * .6; p.y += p.vy; p.a += p.va;
      if (p.y > H + 20 || p.x > W + 20 || p.x < -20) Object.assign(p, nouveau(false));
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = enHorreur ? "rgba(150,0,0,.95)" : "rgba(255,150,195,.85)";
      ctx.beginPath(); ctx.moveTo(0, -p.s);
      ctx.bezierCurveTo(p.s, -p.s * .6, p.s * .7, p.s * .6, 0, p.s);
      ctx.bezierCurveTo(-p.s * .7, p.s * .6, -p.s, -p.s * .6, 0, -p.s * .55);
      ctx.fill(); ctx.restore();
    }
    requestAnimationFrame(dessine);
  }
  dessine();

  // ---------- Musique ----------
  const pistes = {
    menu: document.getElementById("m-menu"),
    ecole: document.getElementById("m-ecole"),
    kiss: document.getElementById("m-kiss"),
  };
  const boutonSon = document.getElementById("son");
  let muet = false, actuelle = null;
  for (const p of Object.values(pistes)) p.volume = .6;

  function jouer(nom) {
    if (actuelle === nom && !pistes[nom].paused) return;
    for (const [n, p] of Object.entries(pistes)) if (n !== nom) { p.pause(); p.currentTime = 0; }
    actuelle = nom;
    const p = pistes[nom];
    p.muted = muet;
    p.play().catch(() => {});
  }

  boutonSon.onclick = (e) => {
    e.stopPropagation();
    muet = !muet;
    for (const p of Object.values(pistes)) p.muted = muet;
    boutonSon.textContent = muet ? "🔇" : "🔊";
    if (!muet) jouer(actuelle || "menu");
  };

  // Musique du menu : essaie tout de suite, sinon au premier toucher de l'écran
  // (les téléphones bloquent le son tant qu'on n'a pas touché la page).
  jouer("menu");
  document.addEventListener("pointerdown", () => { if (actuelle === "menu") jouer("menu"); }, { once: true });

  // ---------- Ouverture ----------
  document.getElementById("ouvrir").onclick = () => {
    jouer("ecole");
    document.getElementById("accueil").classList.add("cache");
    document.getElementById("scene").classList.remove("cache");
    setTimeout(ecrire, 900);
  };

  // ---------- Texte lettre par lettre ----------
  function ecrire() {
    const zone = document.getElementById("texte");
    const lettres = Array.from(MESSAGE);
    let i = 0;
    (function suivante() {
      zone.textContent += lettres[i++];
      if (i < lettres.length) {
        const c = lettres[i - 1];
        setTimeout(suivante, c === "," || c === "…" ? 380 : 55);
      } else {
        document.querySelector(".curseur").style.display = "none";
        setTimeout(() => document.getElementById("question").classList.add("visible"), 600);
      }
    })();
  }

  // ---------- Le bouton « Non » s'enfuit ----------
  const non = document.getElementById("non");
  let essais = 0, dernierEssai = 0;
  function fuir(e) {
    e.preventDefault();
    if (enHorreur) return;
    // Un seul toucher déclenche plusieurs événements : on ne compte qu'un essai par 300 ms.
    const maintenant = Date.now();
    if (maintenant - dernierEssai > 300) { essais++; dernierEssai = maintenant; }
    if (essais > 3) { essais = 0; horreur(); return; }
    const r = non.getBoundingClientRect();
    non.classList.add("fuit");
    const x = 16 + Math.random() * (innerWidth - r.width - 32);
    const y = 70 + Math.random() * (innerHeight - r.height - 140);
    non.style.left = x + "px"; non.style.top = y + "px";
  }
  non.addEventListener("pointerdown", fuir);
  non.addEventListener("mouseenter", fuir);
  non.addEventListener("click", fuir);

  // ---------- Mode terrifiant (10 secondes) ----------
  const DUREE = 10000;
  const portrait = document.querySelector(".portrait img");
  const ruban = document.querySelector(".ruban");
  const zoneTexte = document.getElementById("texte");
  const MOTS = [
    "POURQUOI", "POURQUOI", "POURQUOI ?", "POURQUOI POURQUOI POURQUOI", "pourquoi...",
    "DIS OUI", "RÉPONDS", "REGARDE-MOI", "TU ES À MOI", "NE ME LAISSE PAS EN VU",
    "MYS...", "OUI. OUI. OUI.", "JE TE VOIS", "SENPAI", "NE DIS PLUS JAMAIS NON", "POURQUOI TU FAIS ÇA"
  ];
  const PHRASES = ["Pourquoi tu dis non… ?", "Pourquoi… ?", "POURQUOI ?", "POURQUOI POURQUOI POURQUOI", "Dis oui."];
  let minuteries = [];
  const plus_tard = (fn, ms) => minuteries.push(setTimeout(fn, ms));
  const chaque = (fn, ms) => minuteries.push(setInterval(fn, ms));

  function horreur() {
    enHorreur = true;
    const sauvegarde = { img: portrait.src, ruban: ruban.textContent, texte: zoneTexte.textContent, piste: actuelle };

    portrait.src = "fache.png";
    ruban.textContent = "POURQUOI";
    zoneTexte.textContent = PHRASES[0];
    document.getElementById("mots").innerHTML = "";
    dessinerSang();
    document.body.classList.add("horreur");
    if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 600, 200, 800, 100, 1500]);

    for (const p of Object.values(pistes)) p.pause();
    const stopSon = sonTerrifiant();

    // Mots qui envahissent l'écran, de plus en plus vite
    let rythme = 380;
    (function motSuivant() {
      if (!enHorreur) return;
      ajouterMot();
      rythme = Math.max(110, rythme * .94);
      plus_tard(motSuivant, rythme);
    })();

    // Le texte de la bulle change
    let phrase = 0;
    chaque(() => { phrase = (phrase + 1) % PHRASES.length; zoneTexte.textContent = PHRASES[phrase]; }, 1300);

    // Le visage « bugue » : flashs entre les deux images
    chaque(() => {
      if (Math.random() < .45) {
        portrait.classList.add("glitch");
        if (Math.random() < .3) portrait.src = sauvegarde.img;
        setTimeout(() => { portrait.classList.remove("glitch"); portrait.src = "fache.png"; }, 90 + Math.random() * 120);
      }
    }, 280);

    // Nouvelles éclaboussures pendant tout l'effet
    chaque(() => ajouterTaches(3), 700);

    // Tout s'accélère pour la fin
    plus_tard(() => document.body.classList.add("crescendo"), DUREE * .6);

    plus_tard(() => {
      for (const m of minuteries) { clearTimeout(m); clearInterval(m); }
      minuteries = [];
      stopSon();
      document.body.classList.remove("horreur", "crescendo");
      document.getElementById("mots").innerHTML = "";
      portrait.classList.remove("glitch");
      portrait.src = sauvegarde.img;
      ruban.textContent = sauvegarde.ruban;
      zoneTexte.textContent = sauvegarde.texte;
      non.classList.remove("fuit"); non.style.left = ""; non.style.top = "";
      enHorreur = false;
      if (sauvegarde.piste && !muet) pistes[sauvegarde.piste].play().catch(() => {});
    }, DUREE);
  }

  function ajouterMot() {
    const zone = document.getElementById("mots");
    const m = document.createElement("div");
    m.className = "mot" + (Math.random() < .4 ? " coule" : "");
    m.textContent = MOTS[Math.floor(Math.random() * MOTS.length)];
    const taille = 18 + Math.random() * Math.random() * 70;
    m.style.fontSize = taille + "px";
    m.style.left = (Math.random() * 100 - 15) + "vw";
    m.style.top = (Math.random() * 100 - 4) + "vh";
    m.style.setProperty("--r", (Math.random() * 50 - 25) + "deg");
    m.style.setProperty("--o", (.55 + Math.random() * .45).toFixed(2));
    zone.appendChild(m);
    if (zone.children.length > 32) zone.firstChild.remove();
  }

  // Sang : coulées irrégulières, éclaboussures et flaque qui monte
  function dessinerSang() {
    const svg = document.getElementById("gouttes");
    const w = innerWidth, h = innerHeight;
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    let html = `<defs>
      <linearGradient id="gSang" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3d0000"/><stop offset=".5" stop-color="#7a0000"/><stop offset="1" stop-color="#a30000"/>
      </linearGradient>
      <filter id="organique"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7"/>
        <feDisplacementMap in="SourceGraphic" scale="14"/></filter>
    </defs><g filter="url(#organique)">`;
    // Bandeau de sang en haut, bord irrégulier
    let haut = `M0 0 H${w} V${h * .05}`;
    for (let x = w; x > 0; x -= 18) haut += ` Q${x - 9} ${h * (.04 + Math.random() * .05)} ${x - 18} ${h * (.03 + Math.random() * .04)}`;
    html += `<path d="${haut} Z" fill="url(#gSang)"/>`;
    // Coulées
    for (let x = -8; x < w; x += 10 + Math.random() * 22) {
      const larg = 5 + Math.random() * 20, long = h * (.12 + Math.random() * Math.random() * .9);
      const delai = (Math.random() * 2.5).toFixed(2), r = larg / 2;
      const d = `M${x} 0 C${x} ${long * .4}, ${x + larg * .15} ${long * .7}, ${x + larg * .1} ${long - r}
                 A${r * 1.2} ${r * 1.2} 0 1 0 ${x + larg * .9} ${long - r}
                 C${x + larg * .85} ${long * .7}, ${x + larg} ${long * .4}, ${x + larg} 0 Z`;
      html += `<g class="goutte" style="animation-delay:${delai}s"><path d="${d}" fill="url(#gSang)"/>
        <path d="M${x + larg * .25} 0 V${long * .85}" stroke="rgba(255,120,120,.25)" stroke-width="${Math.max(1, larg * .12)}" stroke-linecap="round"/></g>`;
    }
    // Flaque en bas
    let flaque = `M0 ${h} V${h * .9}`;
    for (let x = 0; x < w; x += 24) flaque += ` Q${x + 12} ${h * (.86 + Math.random() * .05)} ${x + 24} ${h * (.88 + Math.random() * .04)}`;
    html += `<path class="flaque" d="${flaque} V${h} Z" fill="#4a0000"/></g><g id="taches" filter="url(#organique)"></g>`;
    svg.innerHTML = html;
    ajouterTaches(6);
  }

  function ajouterTaches(n) {
    const g = document.getElementById("taches");
    if (!g) return;
    const w = innerWidth, h = innerHeight;
    let html = "";
    for (let i = 0; i < n; i++) {
      const cx = Math.random() * w, cy = Math.random() * h, R = 12 + Math.random() * 34;
      html += `<g class="tache"><circle cx="${cx}" cy="${cy}" r="${R}" fill="#6e0000" opacity=".9"/>`;
      for (let k = 0; k < 9; k++) {
        const a = Math.random() * 6.28, dist = R * (1 + Math.random() * 1.8);
        html += `<circle cx="${cx + Math.cos(a) * dist}" cy="${cy + Math.sin(a) * dist}" r="${2 + Math.random() * R * .22}" fill="#8a0000"/>`;
      }
      html += `</g>`;
    }
    g.insertAdjacentHTML("beforeend", html);
  }

  // ---------- Son terrifiant (généré par le navigateur, aucun fichier) ----------
  let audioCtx;
  function sonTerrifiant() {
    if (muet) return () => {};
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ac = audioCtx;
    if (ac.state === "suspended") ac.resume();
    const t = ac.currentTime, D = DUREE / 1000, fin = t + D;
    const sources = [];
    const lance = (s, debut, arret) => { s.start(debut); s.stop(arret); sources.push(s); };

    // Sortie avec compresseur pour que ce soit fort sans saturer
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 6;
    const sortie = ac.createGain();
    sortie.gain.setValueAtTime(0, t);
    sortie.gain.linearRampToValueAtTime(1, t + .05);
    sortie.gain.setValueAtTime(1, fin - .15);
    sortie.gain.linearRampToValueAtTime(0, fin);
    sortie.connect(comp); comp.connect(ac.destination);

    // Réverbération (salle immense et sombre)
    const rev = ac.createConvolver();
    const longR = ac.sampleRate * 3.5, ir = ac.createBuffer(2, longR, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < longR; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / longR, 2.5); }
    rev.buffer = ir;
    const revG = ac.createGain(); revG.gain.value = .55; rev.connect(revG); revG.connect(sortie);
    const bus = ac.createGain(); bus.connect(sortie); bus.connect(rev);

    // Distorsion
    const disto = ac.createWaveShaper();
    const courbe = new Float32Array(2048);
    for (let i = 0; i < 2048; i++) { const x = i / 1024 - 1; courbe[i] = Math.tanh(x * 12); }
    disto.curve = courbe;

    const bruitBuf = ac.createBuffer(1, ac.sampleRate * D, ac.sampleRate);
    const nb = bruitBuf.getChannelData(0); for (let i = 0; i < nb.length; i++) nb[i] = Math.random() * 2 - 1;

    // 1. Choc d'entrée : impact grave + accord strident
    {
      const o = ac.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(28, t + 1.2);
      const g = ac.createGain(); g.gain.setValueAtTime(1.4, t); g.gain.exponentialRampToValueAtTime(.001, t + 1.4);
      o.connect(g); g.connect(bus); lance(o, t, t + 1.5);
      for (const f of [523, 554, 587, 740, 784]) {
        const s = ac.createOscillator(); s.type = "sawtooth"; s.frequency.value = f;
        const sg = ac.createGain(); sg.gain.setValueAtTime(.09, t); sg.gain.exponentialRampToValueAtTime(.001, t + 2.2);
        s.connect(sg); sg.connect(bus); lance(s, t, t + 2.3);
      }
    }

    // 2. Grondement grave qui monte, filtre qui respire
    {
      const filtre = ac.createBiquadFilter(); filtre.type = "lowpass"; filtre.Q.value = 8;
      filtre.frequency.setValueAtTime(180, t); filtre.frequency.exponentialRampToValueAtTime(900, fin);
      const lfo = ac.createOscillator(); lfo.frequency.value = .7;
      const lfoG = ac.createGain(); lfoG.gain.value = 120; lfo.connect(lfoG); lfoG.connect(filtre.frequency); lance(lfo, t, fin);
      const g = ac.createGain(); g.gain.setValueAtTime(.25, t); g.gain.linearRampToValueAtTime(.55, fin);
      filtre.connect(g); g.connect(bus);
      for (const f of [36.7, 38.9, 55, 58.3, 73.4]) {
        const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = f;
        o.frequency.linearRampToValueAtTime(f * 1.06, fin);
        o.connect(filtre); lance(o, t, fin);
      }
    }

    // 3. Cris : bruit filtré qui glisse + distorsion (son de hurlement)
    function cri(debut, duree, hauteur, volume) {
      const n = ac.createBufferSource(); n.buffer = bruitBuf;
      const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 14;
      bp.frequency.setValueAtTime(hauteur, debut);
      bp.frequency.exponentialRampToValueAtTime(hauteur * 2.2, debut + duree * .4);
      bp.frequency.exponentialRampToValueAtTime(hauteur * 1.3, debut + duree);
      const voix = ac.createOscillator(); voix.type = "sawtooth";
      voix.frequency.setValueAtTime(hauteur / 3, debut); voix.frequency.exponentialRampToValueAtTime(hauteur / 1.4, debut + duree);
      const vib = ac.createOscillator(); vib.frequency.value = 7 + Math.random() * 5;
      const vibG = ac.createGain(); vibG.gain.value = hauteur * .06; vib.connect(vibG); vibG.connect(voix.frequency);
      const vg = ac.createGain(); vg.gain.value = .25; voix.connect(vg); vg.connect(bp);
      n.connect(bp);
      const g = ac.createGain();
      g.gain.setValueAtTime(0, debut); g.gain.linearRampToValueAtTime(volume, debut + .06);
      g.gain.setValueAtTime(volume, debut + duree * .7); g.gain.exponentialRampToValueAtTime(.001, debut + duree);
      bp.connect(disto); disto.connect(g); g.connect(bus);
      n.start(debut, Math.random() * (D - duree - .1)); n.stop(debut + duree); sources.push(n);
      lance(voix, debut, debut + duree); lance(vib, debut, debut + duree);
    }
    cri(t + .3, 1.6, 900, .35);
    cri(t + 2.6, 1.2, 1300, .3);
    cri(t + 4.4, 2.0, 700, .4);
    cri(t + 6.5, .9, 1600, .3);
    cri(t + 7.6, 2.2, 1000, .5);
    cri(t + 8.2, 1.6, 1500, .45);

    // 4. Chuchotements qui tournent autour (gauche/droite)
    for (let k = 0; k < 14; k++) {
      const debut = t + .8 + Math.random() * (D - 1.8), duree = .25 + Math.random() * .6;
      const n = ac.createBufferSource(); n.buffer = bruitBuf;
      const hp = ac.createBiquadFilter(); hp.type = "bandpass"; hp.frequency.value = 2500 + Math.random() * 2500; hp.Q.value = 2;
      const g = ac.createGain();
      g.gain.setValueAtTime(0, debut);
      for (let s = 0; s < duree; s += .06) g.gain.setValueAtTime(Math.random() * .35, debut + s);
      g.gain.setValueAtTime(0, debut + duree);
      const pan = ac.createStereoPanner ? ac.createStereoPanner() : ac.createGain();
      if (pan.pan) pan.pan.value = Math.random() * 2 - 1;
      n.connect(hp); hp.connect(g); g.connect(pan); pan.connect(bus);
      n.start(debut, Math.random() * (D - 1)); n.stop(debut + duree); sources.push(n);
    }

    // 5. Boîte à musique faussée (mélodie mineure qui se désaccorde)
    {
      const notes = [659, 622, 659, 622, 659, 494, 587, 523, 440, 0, 262, 330, 440, 494];
      for (let i = 0; i < 28; i++) {
        const f = notes[i % notes.length]; if (!f) continue;
        const debut = t + 1 + i * .3; if (debut > fin - .3) break;
        const o = ac.createOscillator(); o.type = "triangle";
        const desaccord = 1 - i * .006;
        o.frequency.setValueAtTime(f * desaccord, debut);
        o.frequency.linearRampToValueAtTime(f * desaccord * .97, debut + .5);
        const g = ac.createGain(); g.gain.setValueAtTime(.12, debut); g.gain.exponentialRampToValueAtTime(.001, debut + .6);
        o.connect(g); g.connect(bus); lance(o, debut, debut + .65);
      }
    }

    // 6. Cœur qui bat de plus en plus vite
    for (let b = t + .4, ecart = .9; b < fin - .2; b += ecart, ecart = Math.max(.28, ecart * .9)) {
      for (const d of [0, .14]) {
        const o = ac.createOscillator(); o.type = "sine";
        o.frequency.setValueAtTime(65, b + d); o.frequency.exponentialRampToValueAtTime(30, b + d + .16);
        const g = ac.createGain();
        g.gain.setValueAtTime(0, b + d); g.gain.linearRampToValueAtTime(1.3, b + d + .008);
        g.gain.exponentialRampToValueAtTime(.001, b + d + .2);
        o.connect(g); g.connect(sortie); lance(o, b + d, b + d + .22);
      }
    }

    // 7. Coups brutaux (jumpscares sonores)
    for (const moment of [3.4, 5.9, 8.8]) {
      const debut = t + moment;
      const n = ac.createBufferSource(); n.buffer = bruitBuf;
      const g = ac.createGain(); g.gain.setValueAtTime(1.2, debut); g.gain.exponentialRampToValueAtTime(.001, debut + .5);
      n.connect(disto); disto.connect(g); g.connect(bus);
      n.start(debut, 0); n.stop(debut + .5); sources.push(n);
      for (const f of [98, 104, 147, 156]) {
        const o = ac.createOscillator(); o.type = "square"; o.frequency.value = f;
        const og = ac.createGain(); og.gain.setValueAtTime(.18, debut); og.gain.exponentialRampToValueAtTime(.001, debut + .9);
        o.connect(og); og.connect(bus); lance(o, debut, debut + 1);
      }
    }

    // 8. Grésillements de radio cassée
    {
      const n = ac.createBufferSource(); n.buffer = bruitBuf;
      const g = ac.createGain(); g.gain.value = 0;
      for (let s = 0; s < D; s += .05) g.gain.setValueAtTime(Math.random() < .12 ? .5 : .02, t + s);
      n.connect(g); g.connect(sortie); n.start(t); n.stop(fin); sources.push(n);
    }

    return () => { for (const s of sources) { try { s.stop(); } catch (e) {} } sortie.disconnect(); };
  }

  // ---------- « Oui » ----------
  document.getElementById("oui").onclick = () => {
    jouer("kiss");
    document.getElementById("question").style.display = "none";
    non.style.display = "none";
    document.getElementById("final").classList.add("visible");
    const emojis = ["🌸", "💪", "🌸", "✨", "🎀"];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.textContent = emojis[i % emojis.length];
      c.style.left = Math.random() * 100 + "vw";
      c.style.top = -30 - Math.random() * 120 + "px";
      c.style.animationDelay = Math.random() * .8 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3600);
    }
  };
</script>
